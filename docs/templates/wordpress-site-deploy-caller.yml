# TEMPLATE — caller for a WordPress site repo (e.g. ciatec-wordpress).
# Copy to .github/workflows/deploy.yml in that repo.
#
# Reusable workflow:
#   ciatec-org/ciatec-devops/.github/workflows/deploy-wordpress-site.yml@main
#
# Deploy order: SITE first, NETWORK second (the network preflight requires
# themes/<theme>/style.css to exist under site_dir).
#
# Only the theme folder is synced; the network stack bind-mounts it (site_dir must match
# CIATEC_SITE_DIR of ciatec-wordpress-network; default there: /home/ubuntu/ciatec-wordpress).

name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "wordpress/wp-content/themes/ciatec/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Triggers: only push to main and manual dispatch. NEVER pull_request: the runner has
# Docker access on a host shared with other stacks (equivalent to root).
# Keep this repo private with a protected main.

permissions:
  contents: read

# Serializes deploys of this repo. Concurrency groups are per repository, so site x network
# ordering is enforced by the host lock inside the reusable workflows (/home/ubuntu/.locks/wordpress-deploy.lock).
concurrency:
  group: wordpress-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
    uses: ciatec-org/ciatec-devops/.github/workflows/deploy-wordpress-site.yml@main
    with:
      runner_label: ciatec-wordpress-production
      theme: ciatec
      site_dir: /home/ubuntu/ciatec-wordpress
      site_url: ciatec.org
