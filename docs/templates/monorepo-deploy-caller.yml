# TEMPLATE — copy pieces into the monorepo as separate callers
#
# Preferred layout in ciatec-core:
#   .github/workflows/deploy-api.yml
#   .github/workflows/deploy-app.yml
#
# See docs/runbooks/deploy-monorepo.md for the full GHCR + self-hosted runner flow.
# Reusable workflows live in ciatec-org/ciatec-devops:
#   build-push-ghcr.yml
#   deploy-compose.yml
#
# No org secrets required (GITHUB_TOKEN only).

name: Deploy API (example caller)

on:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push:
    permissions:
      contents: read
      packages: write
    uses: ciatec-org/ciatec-devops/.github/workflows/build-push-ghcr.yml@main
    with:
      image_name: ciatec-api
      context: src/api

  deploy:
    needs: build-push
    permissions:
      contents: read
      packages: read
    uses: ciatec-org/ciatec-devops/.github/workflows/deploy-compose.yml@main
    with:
      service: api
      compose_dir: /home/ubuntu/ciatec-core/src/api
      health_url: http://127.0.0.1:8000/health
