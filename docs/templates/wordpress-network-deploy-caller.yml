# TEMPLATE — caller for the WordPress network repo (ciatec-wordpress-network).
# Copy to .github/workflows/deploy.yml in that repo.
#
# Reusable workflow:
#   ciatec-org/ciatec-devops/.github/workflows/deploy-wordpress-network.yml@main
#
# Every change here affects ALL sites of the network (the WordPress container is recreated).
# First time: run the site deploy first (see wordpress-site-deploy-caller.yml).

name: Deploy network

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - "mu-plugins/**"
      - "plugins.txt"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Triggers: only push to main and manual dispatch. NEVER pull_request: the runner has
# Docker access on a host shared with other stacks (equivalent to root).
# Keep this repo private with a protected main.

permissions:
  contents: read

# Serializes deploys of this repo. Concurrency groups are per repository, so site x network
# ordering is enforced by the host lock inside the reusable workflows (/home/ubuntu/.locks/wordpress-deploy.lock).
concurrency:
  group: wordpress-deploy
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
    uses: ciatec-org/ciatec-devops/.github/workflows/deploy-wordpress-network.yml@main
    with:
      runner_label: ciatec-wordpress-network-production
