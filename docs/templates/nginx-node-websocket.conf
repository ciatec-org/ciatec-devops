# TEMPLATE — Nginx vhost for a Node.js service with WebSocket (deploy-node-service.yml).
# Destino: /etc/nginx/sites-available/SUBDOMINIO.game.ciatec.org
# Trocar SUBDOMINIO, PORTA e o caminho do WebSocket (/ws).
#
# Ativar:  sudo ln -s /etc/nginx/sites-available/SUBDOMINIO.game.ciatec.org /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# TLS:     sudo certbot --nginx -d SUBDOMINIO.game.ciatec.org   (depois que o DNS apontar para a EC2)
#
# O workflow de deploy nunca reescreve este arquivo: o certbot acrescenta o bloco HTTPS aqui.

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO.game.ciatec.org;

    location / {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sem Upgrade/Connection o nginx não completa o handshake e o cliente fica em reconexão.
    location = /ws {
        proxy_pass http://127.0.0.1:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # O padrão (60s) derruba conexões ociosas; telões ficam minutos sem mensagem.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
