# Reusable workflow: build a Docker image and push to GHCR.
# Runs on GitHub-hosted runners (never on the EC2 deploy runner).
#
# Tags published (always):
#   ghcr.io/<owner>/<image_name>:main
#   ghcr.io/<owner>/<image_name>:sha-<7-char>
#
# Auth: GITHUB_TOKEN only (packages: write). No PAT.

name: Build and Push GHCR

on:
  workflow_call:
    inputs:
      image_name:
        description: "Image name without registry (e.g. ciatec-api)"
        required: true
        type: string
      context:
        description: "Build context path relative to repo root (e.g. src/api)"
        required: true
        type: string
      dockerfile:
        description: "Dockerfile name inside the context"
        required: false
        type: string
        default: Dockerfile
      build_args:
        description: "Newline-separated KEY=VALUE build-args"
        required: false
        type: string
        default: ""

jobs:
  build-push:
    name: Build and push ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SHA7="${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${OWNER}/${{ inputs.image_name }}"
          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:main"
            echo "${IMAGE}:sha-${SHA7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing: ${IMAGE}:main and ${IMAGE}:sha-${SHA7}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
